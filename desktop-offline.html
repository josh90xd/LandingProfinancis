<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROFINANCIS - Servidor no disponible</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #6e35ff;
        --brand-dark: #4c1d95;
        --mint: #34d399;
        --ink: #111827;
        --muted: #4b5563;
        --line: #e5e7eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        font-family: Inter, Segoe UI, Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 20%, rgba(110, 53, 255, .18), transparent 30%),
          radial-gradient(circle at 88% 12%, rgba(52, 211, 153, .18), transparent 28%),
          linear-gradient(135deg, #f8fafc, #ffffff 54%, #f5f3ff);
      }
      main {
        width: min(680px, 100%);
        display: grid;
        gap: 18px;
        padding: 34px;
        border: 1px solid rgba(110, 53, 255, .18);
        border-radius: 8px;
        background: rgba(255,255,255,.9);
        box-shadow: 0 24px 70px rgba(17,24,39,.18);
      }
      img { width: 84px; height: 84px; object-fit: contain; }
      h1 { margin: 0; font-size: 34px; letter-spacing: 0; }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      code {
        display: block;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--brand-dark);
        background: #f8fafc;
        overflow-wrap: anywhere;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 16px;
        color: #fff;
        background: linear-gradient(135deg, var(--brand), var(--brand-dark));
        font-weight: 900;
        cursor: pointer;
      }
      button.secondary {
        color: var(--brand-dark);
        background: #fff;
        border: 1px solid rgba(110, 53, 255, .28);
      }
      .status { color: #92400e; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <img src="/profinancis-logo.png" alt="PROFINANCIS" />
      <h1>Servidor no disponible</h1>
      <p>La aplicacion de escritorio esta funcionando, pero no pudo conectarse al servidor configurado.</p>
      <code id="server">Servidor: verificando...</code>
      <p class="status" id="status">Revisa que el backend este encendido y que la URL sea correcta.</p>
      <div class="actions">
        <button id="retry">Reintentar</button>
        <button class="secondary" id="diagnostics">Ver diagnostico</button>
      </div>
    </main>
    <script>
      let server = localStorage.getItem("pf_server_url") || location.origin;
      const setServer = (value) => {
        server = value || server;
        document.getElementById("server").textContent = `Servidor: ${server}`;
      };
      setServer(server);
      const loadDiagnostics = async () => {
        const tauriCore = window.__TAURI__ && window.__TAURI__.core;
        if (!tauriCore) return;
        try {
          const diagnostics = await tauriCore.invoke("desktop_diagnostics");
          setServer(diagnostics.serverUrl);
          if (diagnostics.lastError) {
            document.getElementById("status").textContent = diagnostics.lastError;
          }
        } catch (_error) {
          setServer(server);
        }
      };
      loadDiagnostics();
      document.getElementById("retry").addEventListener("click", () => {
        location.href = `${server.replace(/\/$/, "")}/dashboard/admin`;
      });
      document.getElementById("diagnostics").addEventListener("click", async () => {
        const status = document.getElementById("status");
        status.textContent = "Probando conexion...";
        try {
          const started = performance.now();
          const response = await fetch(`${server.replace(/\/$/, "")}/health`, { cache: "no-store" });
          const latency = Math.round(performance.now() - started);
          status.textContent = response.ok ? `API online. Latencia: ${latency} ms.` : `API respondio con estado ${response.status}.`;
        } catch (error) {
          status.textContent = "API offline o inaccesible desde este equipo.";
        }
      });
    </script>
  </body>
</html>
